[tool:pytest]
# Pytest configuration for Legal Document Simplifier

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions/classes
    integration: Integration tests for component interactions
    slow: Tests that take longer to run (e.g., model loading)
    gpu: Tests that require GPU
    classification: Tests for classification functionality
    summarization: Tests for summarization functionality
    simplification: Tests for simplification functionality
    pipeline: Tests for end-to-end pipeline functionality

# Ignore patterns
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    htmlcov
    .pytest_cache

# Minimum version
minversion = 7.0
